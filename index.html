<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FF6B35">
<title>Thai Word Finder · ค้นหาคำ WordLink</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #FFF8EC;
  --bg2: #F5E6CC;
  --card: #FFFFFF;
  --header: #1E2440;
  --header2: #323A5A;
  --accent: #FF6B35;
  --accent2: #FFA040;
  --gold: #FFD248;
  --rare: #C882F0;
  --rareBg: #F5E6FF;
  --ink: #281408;
  --inkSoft: #786450;
  --lime: #78C850;
  --blue: #50A0F0;
  --cream: #FFF4DE;
  --cream2: #F4E6CC;
  --border: #E5D5B5;
}

html, body {
  font-family: -apple-system, BlinkMacSystemFont, "Sarabun", "Noto Sans Thai",
               "Segoe UI", system-ui, sans-serif;
  background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 100%);
  color: var(--ink);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

body {
  padding: 16px;
  display: flex;
  justify-content: center;
}

.app {
  width: 100%;
  max-width: 720px;
  background: var(--card);
  border-radius: 20px;
  box-shadow: 0 8px 32px rgba(40, 20, 8, 0.15),
              0 2px 8px rgba(40, 20, 8, 0.08);
  overflow: hidden;
  border: 2px solid var(--border);
  opacity: 0;
  transform: translateY(20px) scale(0.98);
  transition: opacity 0.5s ease, transform 0.5s ease;
}

.app.ready {
  opacity: 1;
  transform: translateY(0) scale(1);
}

/* ── Header ── */
.header {
  background: linear-gradient(135deg, var(--header2), var(--header));
  color: white;
  padding: 18px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: relative;
}

.header-icon {
  font-size: 28px;
  line-height: 1;
}

.header h1 {
  font-size: 22px;
  font-weight: 700;
  flex: 1;
  letter-spacing: 0.2px;
  min-width: 0;
}

.header .count {
  background: rgba(255, 255, 255, 0.18);
  padding: 4px 12px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
}

/* ── IG Credit Badge ── */
.ig-badge {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 12px 6px 8px;
  background: linear-gradient(135deg, #FEDA75, #FA7E1E, #D62976, #962FBF);
  border-radius: 20px;
  text-decoration: none;
  color: white;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  box-shadow: 0 2px 8px rgba(214, 41, 118, 0.35);
  transition: transform 0.15s, box-shadow 0.15s;
  cursor: pointer;
  flex-shrink: 0;
}

.ig-badge:active {
  transform: scale(0.95);
}

.ig-badge svg {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,0.2));
}

/* ── Search ── */
.search-section {
  padding: 16px 16px 8px;
  background: linear-gradient(180deg, var(--cream), var(--card));
}

.search-bar {
  display: flex;
  align-items: center;
  background: white;
  border: 2px solid var(--cream2);
  border-radius: 14px;
  padding: 6px 14px;
  gap: 10px;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.search-bar:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.15);
}

.search-bar .icon {
  font-size: 22px;
  opacity: 0.6;
}

#searchInput {
  flex: 1;
  border: none;
  outline: none;
  font-size: 22px;
  font-weight: 600;
  color: var(--ink);
  background: transparent;
  padding: 12px 0;
  font-family: inherit;
  min-width: 0;
}

#searchInput::placeholder {
  color: var(--inkSoft);
  font-weight: 400;
  font-size: 17px;
}

.letters-preview {
  font-size: 13px;
  color: var(--accent);
  font-weight: 700;
  white-space: nowrap;
  padding: 4px 0;
}

/* ── Filter ── */
.filter-section {
  display: flex;
  gap: 8px;
  padding: 8px 16px 12px;
  align-items: center;
  flex-wrap: wrap;
}

.filter-label {
  font-size: 13px;
  color: var(--inkSoft);
  font-weight: 600;
  margin-right: 4px;
}

.filter-btn {
  padding: 8px 18px;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
  color: white;
  cursor: pointer;
  transition: transform 0.15s, opacity 0.2s;
  font-family: inherit;
  min-height: 38px;
  min-width: 80px;
}

.filter-btn:active { transform: scale(0.95); }

.filter-btn.mode-all {
  background: linear-gradient(135deg, #96DC64, var(--lime));
}
.filter-btn.mode-normal {
  background: linear-gradient(135deg, #78BEFF, var(--blue));
}
.filter-btn.mode-rare {
  background: linear-gradient(135deg, #DCA0FF, var(--rare));
}

.filter-btn.inactive {
  opacity: 0.4;
}

/* ── Stats ── */
.stats {
  padding: 8px 18px;
  font-size: 14px;
  color: var(--inkSoft);
  font-weight: 600;
  border-bottom: 1px solid var(--cream2);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.stats .left { flex: 1; min-width: 0; }
.stats .right {
  color: var(--accent);
  font-weight: 700;
  white-space: nowrap;
}

/* ── Results ── */
.results {
  max-height: 60vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 10px 12px;
}

.results::-webkit-scrollbar { width: 6px; }
.results::-webkit-scrollbar-thumb {
  background: var(--cream2);
  border-radius: 3px;
}

.word-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  margin-bottom: 6px;
  background: var(--cream);
  border: 1.5px solid var(--cream2);
  border-radius: 12px;
  cursor: pointer;
  transition: transform 0.12s, background 0.15s, border-color 0.15s;
  user-select: none;
  min-height: 48px;
  animation: slideIn 0.3s ease backwards;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateX(-10px); }
  to { opacity: 1; transform: translateX(0); }
}

.word-item:active {
  transform: scale(0.98);
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.word-item:active .word-num,
.word-item:active .word-len {
  color: rgba(255, 255, 255, 0.8);
}

.word-item.rare {
  background: var(--rareBg);
  border-color: var(--rare);
}

.word-item.rare:active {
  background: var(--rare);
  color: white;
}

.word-num {
  font-size: 13px;
  color: var(--inkSoft);
  font-weight: 600;
  min-width: 32px;
  flex-shrink: 0;
}

.word-text {
  flex: 1;
  font-size: 18px;
  font-weight: 700;
  color: var(--ink);
  word-break: break-word;
  min-width: 0;
}

.word-item.rare .word-text {
  color: var(--rare);
}

.word-star {
  font-size: 16px;
  color: var(--rare);
}

.word-tag {
  font-size: 11px;
  font-weight: 800;
  padding: 3px 8px;
  border-radius: 8px;
  background: var(--rare);
  color: white;
  flex-shrink: 0;
}

.word-len {
  font-size: 12px;
  color: var(--inkSoft);
  font-weight: 600;
  white-space: nowrap;
  flex-shrink: 0;
}

/* ── Empty state ── */
.empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--inkSoft);
  font-size: 16px;
}

.empty .emoji {
  font-size: 48px;
  display: block;
  margin-bottom: 12px;
  opacity: 0.6;
}

/* ── Pagination ── */
.pagination {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: var(--cream);
  border-top: 1px solid var(--cream2);
  gap: 12px;
}

.page-btn {
  padding: 10px 22px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 700;
  color: white;
  background: linear-gradient(135deg, var(--accent2), var(--accent));
  cursor: pointer;
  font-family: inherit;
  min-height: 44px;
  transition: transform 0.12s, opacity 0.2s;
}

.page-btn:active { transform: scale(0.95); }
.page-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.page-info {
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
  white-space: nowrap;
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: white;
  padding: 12px 24px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  opacity: 0;
  transition: opacity 0.25s, transform 0.25s;
  pointer-events: none;
  z-index: 1000;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  max-width: 90vw;
  text-align: center;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.toast .word {
  color: var(--gold);
  font-weight: 800;
}

/* ── Hint ── */
.hint {
  padding: 8px 16px 4px;
  font-size: 12px;
  color: var(--inkSoft);
  text-align: center;
  line-height: 1.5;
}

/* ── Footer ── */
.footer {
  padding: 10px 16px 14px;
  text-align: center;
  font-size: 11px;
  color: var(--inkSoft);
  border-top: 1px solid var(--cream2);
  background: var(--cream);
}

.footer a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 700;
}

/* ── Responsive ── */
@media (max-width: 480px) {
  body { padding: 8px; }
  .header { padding: 14px 14px; gap: 8px; }
  .header h1 { font-size: 17px; }
  .header .count { font-size: 11px; padding: 3px 8px; }
  .ig-badge { padding: 5px 10px 5px 7px; font-size: 12px; }
  .ig-badge svg { width: 16px; height: 16px; }
  #searchInput { font-size: 19px; }
  #searchInput::placeholder { font-size: 14px; }
  .word-text { font-size: 16px; }
  .filter-btn { padding: 7px 14px; font-size: 14px; min-width: 70px; }
  .results { max-height: 55vh; }
}

@media (min-width: 769px) {
  .results { max-height: 70vh; }
}

@supports (-webkit-touch-callout: none) {
  #searchInput { font-size: 22px; }
}

/* ════════════════════════════════════════════════════════════
   Thai Word Finder · Loader
   ตัวอักษรไทยสามช่องร่วงลงมา แล้วถูกโซ่ทองเชื่อมต่อกันตามความคืบหน้า
   ใช้คู่กับ loader.js  (ทุก class ขึ้นต้นด้วย wl- ไม่ชนกับ CSS เดิม)
   ════════════════════════════════════════════════════════════ */

.wl-loader {
  --wl-night: #12152b;
  --wl-indigo: #2b3263;
  --wl-paper: #fff4de;
  --wl-edge: #d9bf8c;
  --wl-ember: #ff6b35;
  --wl-gold: #ffd248;
  --p: 0;

  position: fixed;
  inset: 0;
  z-index: 9999;
  display: grid;
  place-items: center;
  overflow: hidden;
  padding: 24px;
  color: var(--wl-paper);
  font-family: -apple-system, BlinkMacSystemFont, "Sarabun", "Noto Sans Thai",
               "Segoe UI", system-ui, sans-serif;
  background:
    radial-gradient(120% 90% at 50% 38%, var(--wl-indigo) 0%, #181c3a 52%, var(--wl-night) 100%);
  clip-path: circle(150% at 50% 44%);
  transition: clip-path 0.9s cubic-bezier(0.76, 0, 0.24, 1);
  -webkit-tap-highlight-color: transparent;
  cursor: pointer;
}

/* จบ: ม่านวงกลมหุบเข้าหาโซ่ เผยแอปที่อยู่ข้างล่าง */
.wl-loader.wl-exit {
  clip-path: circle(0% at 50% 44%);
  pointer-events: none;
}

/* ─── ตัวอักษรขนาดยักษ์ลอยขึ้นช้าๆ เป็นฉากหลัง ─── */
.wl-drift {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.wl-drift span {
  position: absolute;
  bottom: 0;
  line-height: 1.4;
  font-weight: 800;
  color: transparent;
  -webkit-text-stroke: 1.5px rgba(255, 244, 222, 0.09);
  transform: translateY(40%);
  animation: wl-rise linear infinite;
  will-change: transform;
}

@keyframes wl-rise {
  to { transform: translateY(-130vh) rotate(var(--spin, 12deg)); }
}

/* ─── เวที ─── */
.wl-stage {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 380px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

.wl-chain-wrap {
  position: relative;
  margin-bottom: 38px;
}

/* แสงอุ่นหลังโซ่ สว่างขึ้นตามความคืบหน้า */
.wl-glow {
  position: absolute;
  inset: -70px -50px;
  background: radial-gradient(closest-side, rgba(255, 107, 53, 0.55), rgba(255, 210, 72, 0.14) 60%, transparent 100%);
  opacity: calc(0.12 + var(--p) * 0.88);
  filter: blur(8px);
  pointer-events: none;
}

.wl-chain {
  position: relative;
  display: flex;
  align-items: center;
}

/* ─── ช่องตัวอักษร ─── */
.wl-slot {
  opacity: 0;
  animation: wl-drop 0.95s cubic-bezier(0.3, 1.45, 0.5, 1) both;
  animation-delay: calc(var(--i) * 0.16s + 0.1s);
}

@keyframes wl-drop {
  0%   { transform: translateY(-90vh) rotate(var(--r)); opacity: 0; }
  35%  { opacity: 1; }
  100% { transform: translateY(0) rotate(0); opacity: 1; }
}

.wl-tile {
  position: relative;
  width: 84px;
  height: 94px;
  display: grid;
  place-items: center;
  border-radius: 16px;
  background: linear-gradient(180deg, #fffaf0, #ffeccb);
  box-shadow:
    0 7px 0 var(--wl-edge),
    0 18px 28px rgba(0, 0, 0, 0.38),
    inset 0 2px 0 #fff;
  transition: box-shadow 0.35s ease;
}

/* ชั้นสีทองที่เฟดขึ้นมาเมื่อโซ่ไปถึงช่องนี้ */
.wl-tile::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(180deg, #ffe58a, var(--wl-gold) 55%, #ffb627);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.7);
  opacity: 0;
  transition: opacity 0.35s ease;
}

.wl-tile span {
  position: relative;
  z-index: 1;
  font-size: 38px;
  font-weight: 800;
  line-height: 1.6;
  color: #3b2410;
}

.wl-tile.wl-lit {
  box-shadow:
    0 7px 0 #c98a1b,
    0 0 46px rgba(255, 210, 72, 0.7),
    0 18px 28px rgba(0, 0, 0, 0.38);
  animation: wl-hop 0.5s cubic-bezier(0.3, 1.6, 0.5, 1);
}

.wl-tile.wl-lit::after { opacity: 1; }

@keyframes wl-hop {
  0%   { transform: translateY(0) scale(1); }
  40%  { transform: translateY(-14px) scale(1.07); }
  100% { transform: translateY(0) scale(1); }
}

/* เสร็จแล้ว: ทั้งสามช่องกระโดดไล่กันเป็นคลื่น */
.wl-done .wl-tile {
  animation: wl-hop 0.55s cubic-bezier(0.3, 1.6, 0.5, 1) both;
  animation-delay: calc(var(--i) * 0.1s);
}

/* ─── ห่วงโซ่ระหว่างช่อง (นี่คือ progress bar) ─── */
.wl-link {
  position: relative;
  width: 44px;
  height: 12px;
  margin: 0 -2px;
  border-radius: 12px;
  background: rgba(255, 244, 222, 0.16);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35);
  overflow: hidden;
  animation: wl-fade 0.6s ease 0.7s both;
}

.wl-link i {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--wl-ember), var(--wl-gold));
  box-shadow: 0 0 14px rgba(255, 210, 72, 0.9);
  transform-origin: left center;
  transform: scaleX(var(--f, 0));
}

@keyframes wl-fade {
  from { opacity: 0; }
  to   { opacity: 1; }
}

/* ─── ตัวเลข + ข้อความ ─── */
.wl-count {
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-variant-numeric: tabular-nums;
  animation: wl-fade 0.6s ease 0.9s both;
}

.wl-count b {
  min-width: 3ch;
  text-align: right;
  font-size: 54px;
  font-weight: 800;
  line-height: 1.2;
  letter-spacing: -0.5px;
  color: var(--wl-gold);
  text-shadow: 0 0 28px rgba(255, 107, 53, 0.55);
}

.wl-count span {
  min-width: 5.5ch;
  text-align: left;
  font-size: 15px;
  font-weight: 600;
  color: rgba(255, 244, 222, 0.55);
}

.wl-title {
  margin-top: 6px;
  font-size: 27px;
  font-weight: 800;
  letter-spacing: 0.4px;
  animation: wl-fade 0.7s ease 1.05s both;
}

.wl-sub {
  margin-top: 6px;
  font-size: 14px;
  color: rgba(255, 244, 222, 0.62);
  animation: wl-fade 0.7s ease 1.2s both;
}

.wl-status {
  margin-top: 26px;
  min-height: 22px;
  font-size: 14px;
  font-weight: 700;
  color: var(--wl-ember);
  animation: wl-fade 0.7s ease 1.3s both;
}

.wl-done .wl-status { color: var(--wl-gold); }

/* ─── เครดิต ─── */
.wl-credit {
  position: absolute;
  z-index: 2;
  bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
  color: rgba(255, 244, 222, 0.42);
  text-decoration: none;
  white-space: nowrap;
}

.wl-credit b {
  font-weight: 700;
  color: rgba(255, 244, 222, 0.78);
}

/* ประกายตัวอักษรตอนเสร็จ (วาดด้วย canvas) */
.wl-burst {
  position: absolute;
  inset: 0;
  z-index: 3;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* ─── จอเล็ก ─── */
@media (max-width: 380px) {
  .wl-tile { width: 68px; height: 78px; border-radius: 14px; }
  .wl-tile span { font-size: 31px; }
  .wl-link { width: 28px; }
  .wl-count b { font-size: 46px; }
  .wl-title { font-size: 23px; }
}

/* ─── ผู้ใช้ปิดแอนิเมชันในระบบ: ตัดการเคลื่อนไหวใหญ่ออก ─── */
@media (prefers-reduced-motion: reduce) {
  .wl-drift { display: none; }
  .wl-slot { animation: wl-fade 0.3s ease both; animation-delay: 0s; }
  .wl-tile.wl-lit, .wl-done .wl-tile { animation: none; }
  .wl-loader { transition: opacity 0.4s ease; clip-path: none; }
  .wl-loader.wl-exit { opacity: 0; clip-path: none; }
}

</style>
</head>
<body>
<script data-total="853">
/* ════════════════════════════════════════════════════════════
   Thai Word Finder · Loader
   วิธีใช้: ใส่แท็ก script ที่ชี้ไป loader.js ไว้บรรทัดแรกหลัง body เปิด
   (เพื่อให้โหลดก่อนส่วนอื่น) พร้อม attribute data-total="853"
   ต้องมีองค์ประกอบ id="app" ในหน้า (ใช้ class "ready" เปิดตัวแอปเหมือนเดิม)
   ════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  var script = document.currentScript;
  var TOTAL = parseInt(script && script.getAttribute('data-total'), 10) || 853;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  var DURATION = reduce ? 500 : 2000;   // เวลาโซ่เชื่อมจนครบ
  var HOLD     = reduce ? 150 : 650;    // ค้างให้เห็นตอนเสร็จ ก่อนม่านหุบ
  var EXIT_MS  = reduce ? 400 : 900;    // ตรงกับ transition ใน loader.css

  var LETTERS = 'กขคงจชซดตทนบปผฟมยรลวสหอฮ';
  var BURST_LETTERS = 'กขคงจชดตทนบปมยรลวสหอ ะาิีึืุูเแโใไ';
  var COLORS = ['#ffd248', '#ff6b35', '#fff4de', '#ffb627'];

  // ─── สร้างโครง ───
  var root = document.createElement('div');
  root.className = 'wl-loader';
  root.setAttribute('role', 'status');
  root.setAttribute('aria-live', 'polite');
  root.setAttribute('aria-label', 'กำลังโหลดคำศัพท์');
  root.innerHTML =
    '<div class="wl-drift" aria-hidden="true"></div>' +
    '<div class="wl-stage">' +
      '<div class="wl-chain-wrap">' +
        '<div class="wl-glow"></div>' +
        '<div class="wl-chain">' +
          '<div class="wl-slot" style="--i:0;--r:-14deg"><div class="wl-tile"><span>ค้น</span></div></div>' +
          '<div class="wl-link"><i></i></div>' +
          '<div class="wl-slot" style="--i:1;--r:11deg"><div class="wl-tile"><span>หา</span></div></div>' +
          '<div class="wl-link"><i></i></div>' +
          '<div class="wl-slot" style="--i:2;--r:-8deg"><div class="wl-tile"><span>คำ</span></div></div>' +
        '</div>' +
      '</div>' +
      '<div class="wl-count"><b>0</b><span>/ ' + TOTAL + ' คำ</span></div>' +
      '<div class="wl-title">Thai Word Finder</div>' +
      '<div class="wl-sub">ค้นหาคำสำหรับเกม WordLink</div>' +
      '<div class="wl-status">กำลังโหลดคำศัพท์…</div>' +
    '</div>' +
    '<div class="wl-credit">สร้างโดย <b>@x2zext</b></div>' +
    '<canvas class="wl-burst" aria-hidden="true"></canvas>';

  document.body.insertAdjacentElement('afterbegin', root);

  var tiles  = root.querySelectorAll('.wl-tile');
  var links  = root.querySelectorAll('.wl-link i');
  var numEl  = root.querySelector('.wl-count b');
  var status = root.querySelector('.wl-status');
  var canvas = root.querySelector('.wl-burst');

  // ─── ตัวอักษรลอยเป็นฉากหลัง ───
  if (!reduce) {
    var drift = root.querySelector('.wl-drift');
    for (var i = 0; i < 12; i++) {
      var s = document.createElement('span');
      s.textContent = LETTERS.charAt(Math.floor(Math.random() * LETTERS.length));
      s.style.left = (4 + Math.random() * 88) + '%';
      s.style.fontSize = (90 + Math.random() * 150) + 'px';
      s.style.animationDuration = (16 + Math.random() * 14) + 's';
      s.style.animationDelay = (-Math.random() * 24) + 's';
      s.style.setProperty('--spin', (Math.random() * 30 - 15) + 'deg');
      drift.appendChild(s);
    }
  }

  // ─── ความคืบหน้า ───
  var state = 'run';      // run → hold → gone
  var skip = false;
  var raf = 0;
  var t0 = performance.now();

  function clamp(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

  function light(index, on) {
    if (on && !tiles[index].classList.contains('wl-lit')) tiles[index].classList.add('wl-lit');
  }

  function frame(now) {
    var t = skip ? 1 : Math.min((now - t0) / DURATION, 1);
    var p = ease(t);

    root.style.setProperty('--p', p.toFixed(4));
    links[0].style.setProperty('--f', clamp(p * 2).toFixed(4));
    links[1].style.setProperty('--f', clamp(p * 2 - 1).toFixed(4));
    numEl.textContent = Math.round(p * TOTAL);

    light(0, p > 0.04);
    light(1, p >= 0.5);

    if (t < 1) { raf = requestAnimationFrame(frame); }
    else { finish(); }
  }

  function finish() {
    state = 'hold';
    numEl.textContent = TOTAL;
    light(2, true);
    status.textContent = 'พร้อมใช้งาน';
    root.classList.add('wl-done');
    if (!reduce) burst();
    setTimeout(exit, skip ? 150 : HOLD);
  }

  function exit() {
    if (state === 'gone') return;
    state = 'gone';
    root.classList.add('wl-exit');
    var app = document.getElementById('app');
    if (app) app.classList.add('ready');
    setTimeout(function () {
      if (root.parentNode) root.parentNode.removeChild(root);
    }, EXIT_MS + 100);
  }

  // แตะที่หน้าจอเพื่อข้าม
  root.addEventListener('click', function () {
    if (state === 'run') { skip = true; }
    else if (state === 'hold') { exit(); }
  });

  // ─── ประกายตัวอักษรตอนเสร็จ ───
  function burst() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = root.clientWidth, h = root.clientHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    var ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    var r = tiles[2].getBoundingClientRect();
    var ox = r.left + r.width / 2, oy = r.top + r.height / 2;

    var parts = [];
    for (var i = 0; i < 38; i++) {
      var a = Math.random() * Math.PI * 2;
      var v = 140 + Math.random() * 360;          // px ต่อวินาที
      parts.push({
        x: ox, y: oy,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v - 120,
        ch: BURST_LETTERS.charAt(Math.floor(Math.random() * BURST_LETTERS.length)).trim() || 'ก',
        size: 20 + Math.random() * 18,
        rot: Math.random() * 2 - 1,
        color: COLORS[i % COLORS.length]
      });
    }

    var start = performance.now(), LIFE = 1100, last = start;
    (function step(now) {
      var age = now - start, dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      ctx.clearRect(0, 0, w, h);
      if (age >= LIFE) return;
      var alpha = 1 - age / LIFE;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (var j = 0; j < parts.length; j++) {
        var q = parts[j];
        q.vy += 620 * dt;                         // แรงโน้มถ่วง
        q.x += q.vx * dt;
        q.y += q.vy * dt;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(q.x, q.y);
        ctx.rotate(q.rot * age / 400);
        ctx.fillStyle = q.color;
        ctx.font = '800 ' + q.size + 'px "Sarabun","Noto Sans Thai",system-ui,sans-serif';
        ctx.fillText(q.ch, 0, 0);
        ctx.restore();
      }
      requestAnimationFrame(step);
    })(start);
  }

  raf = requestAnimationFrame(frame);
})();
</script>

function parseLetters(text) {
  const letters = [];
  for (const ch of text || '') {
    const code = ch.codePointAt(0);
    if (code >= 0x0E01 && code <= 0x0E5B) {
      letters.push(ch);
      if (letters.length >= 3) break;
    }
  }
  return letters;
}

function searchWords(letters) {
  if (letters.length === 0) return [];
  const results = [];
  for (const word in WORDS) {
    if (BAD[word]) continue;
    let ok = true;
    for (const letter of letters) {
      if (word.indexOf(letter) === -1) { ok = false; break; }
    }
    if (ok) {
      const info = WORDS[word];
      results.push({word: word, len: info[0], rare: info[1]});
    }
  }
  results.sort((a, b) => {
    if (a.rare !== b.rare) return b.rare - a.rare;
    if (a.len !== b.len) return b.len - a.len;
    return a.word < b.word ? -1 : 1;
  });
  return results;
}

function applyFilter(results) {
  if (filterMode === 'all') return results;
  return results.filter(item =>
    filterMode === 'rare' ? item.rare : !item.rare
  );
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText &&
      window.isSecureContext) {
    navigator.clipboard.writeText(text).then(
      () => showToast(text, true),
      () => fallbackCopy(text)
    );
  } else {
    fallbackCopy(text);
  }
}

  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  ta.style.top = '0';
  ta.setAttribute('readonly', '');
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  showToast(text, ok);
}

let toastTimer;
function showToast(word, ok) {
  toast.innerHTML = ok
    ? '✓ คัดลอกแล้ว: <span class="word">' + escapeHtml(word) + '</span>'
    : 'คำ: <span class="word">' + escapeHtml(word) + '</span><br><small>แตะค้างเพื่อคัดลอกเอง</small>';
  toast.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ═══════════════════════════════════════════════════════════
// Render
// ═══════════════════════════════════════════════════════════
function renderPage() {
  results.innerHTML = '';
  const total = currentResults.length;
  if (total === 0) {
    results.innerHTML = '<div class="empty">' +
      (currentLetters.length > 0
        ? '<span class="emoji">🔍</span>ไม่พบคำที่มีตัวอักษร ' +
          currentLetters.join(' ') + ' ครบทุกตัว<br><small>ลองพิมพ์ตัวอักษรอื่น</small>'
        : '<span class="emoji">📝</span>ยังไม่ได้ค้นหา<br><small>พิมพ์ตัวอักษรข้างบน</small>') +
      '</div>';
    pagination.style.display = 'none';
    return;
  }

  const totalPages = Math.max(1, Math.ceil(total / PER_PAGE));
  currentPage = Math.max(0, Math.min(currentPage, totalPages - 1));
  const start = currentPage * PER_PAGE;
  const end = Math.min(start + PER_PAGE, total);

  for (let i = start; i < end; i++) {
    const item = currentResults[i];
    const div = document.createElement('div');
    div.className = 'word-item' + (item.rare ? ' rare' : '');
    div.style.animationDelay = ((i - start) * 0.04) + 's';
    div.innerHTML =
      '<span class="word-num">' + (i + 1) + '.</span>' +
      '<span class="word-text">' +
        (item.rare ? '<span class="word-star">★</span> ' : '') +
        escapeHtml(item.word) +
      '</span>' +
      (item.rare ? '<span class="word-tag">×2</span>' : '') +
      '<span class="word-len">' + item.len + ' ตัว</span>';
    div.addEventListener('click', () => copyText(item.word));
    results.appendChild(div);
  }

  const rareCount = currentResults.filter(r => r.rare).length;
  const filterText = filterMode === 'rare' ? ' (หายากเท่านั้น)'
                   : filterMode === 'normal' ? ' (ปกติเท่านั้น)' : '';
  stats.innerHTML =
    '<span class="left">พบ <b>' + total + '</b> คำ' + filterText +
    (rareCount > 0 ? ' · ★ ' + rareCount + ' คำ' : '') + '</span>' +
    '<span class="right">เรียง: ยาว→สั้น</span>';

  if (totalPages > 1) {
    pagination.style.display = 'flex';
    pageInfo.textContent = (currentPage + 1) + ' / ' + totalPages;
    prevBtn.disabled = currentPage === 0;
    nextBtn.disabled = currentPage >= totalPages - 1;
  } else {
    pagination.style.display = 'none';
  }
}

function doSearch(text) {
  const letters = parseLetters(text);
  currentLetters = letters;
  if (letters.length > 0) {
    lettersPreview.textContent = 'ค้นหาคำที่มี: ' + letters.join(' ');
  } else {
    lettersPreview.textContent = '';
  }
  if (letters.length === 0) {
    currentResults = [];
    currentPage = 0;
    renderPage();
    return;
  }
  const all = searchWords(letters);
  currentResults = applyFilter(all);
  currentPage = 0;
  renderPage();
}

// ═══════════════════════════════════════════════════════════
// Events
// ═══════════════════════════════════════════════════════════
let debounce;
searchInput.addEventListener('input', (e) => {
  if (debounce) clearTimeout(debounce);
  debounce = setTimeout(() => doSearch(e.target.value), 150);
});

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    if (debounce) clearTimeout(debounce);
    doSearch(e.target.value);
  }
});

prevBtn.addEventListener('click', () => {
  if (currentPage > 0) {
    currentPage--;
    renderPage();
    results.scrollTop = 0;
  }
});

nextBtn.addEventListener('click', () => {
  const totalPages = Math.ceil(currentResults.length / PER_PAGE);
  if (currentPage < totalPages - 1) {
    currentPage++;
    renderPage();
    results.scrollTop = 0;
  }
});

function setFilter(mode) {
  filterMode = mode;
  $('filterAll').classList.toggle('inactive', mode !== 'all');
  $('filterNormal').classList.toggle('inactive', mode !== 'normal');
  $('filterRare').classList.toggle('inactive', mode !== 'rare');
  if (currentLetters.length > 0) {
    const all = searchWords(currentLetters);
    currentResults = applyFilter(all);
    currentPage = 0;
    renderPage();
  }
}

$('filterAll').addEventListener('click', () => setFilter('all'));
$('filterNormal').addEventListener('click', () => setFilter('normal'));
$('filterRare').addEventListener('click', () => setFilter('rare'));

// ═══════════════════════════════════════════════════════════
// Init
// ═══════════════════════════════════════════════════════════
totalCount.textContent = TOTAL_WORDS + ' คำ';

// โฟกัส input หลัง loader หายไป (ไม่ใช่ iOS เพราะจะเด้งคีย์บอร์ด)
setTimeout(() => {
  if (!/iPad|iPhone|iPod/.test(navigator.userAgent)) {
    searchInput.focus();
  }
}, 2200);

console.log('Thai Word Finder พร้อมใช้งาน! (' + TOTAL_WORDS + ' คำ)');
console.log('IG: @x2zext');
</script>
